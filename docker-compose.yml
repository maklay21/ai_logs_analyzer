services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_logs_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-ai_logs_analyzer}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-logs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_logs_analyzer}
      MCP_DATABASE_URL: sqlite+pysqlite:////data/ai_logs_analyzer_mcp.db
      LOG_ALLOWED_ROOTS: ${LOG_ALLOWED_ROOTS:-/logs}
      AUTO_LOG_SOURCE_PATHS: ${AUTO_LOG_SOURCE_PATHS:-/logs}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      RESOURCE_POLL_SECONDS: ${RESOURCE_POLL_SECONDS:-15}
      AGENT_POLL_SECONDS: ${AGENT_POLL_SECONDS:-60}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      TARGET_CONTAINER: ${TARGET_CONTAINER:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173}
      MAX_LOG_FILES: ${MAX_LOG_FILES:-500}
      MAX_LOG_LINES: ${MAX_LOG_LINES:-50000}
    volumes:
      - ${LOGS_PATH:-./sample_logs}:/logs:ro
      - mcp_data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  mcp_data:
